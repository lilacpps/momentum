freeze_version: 2
freeze_date: "2026-08-18"

warmup_data_start: "2015-01"

development_period:
  start: "2017-01"
  end: "2021-12"

validation_period:
  start: "2022-01"
  end: "2023-12"

final_holdout_period:
  start: "2024-01"
  end: "2026-06"

split_assignment:
  basis: next_1m_return_outcome_month

symbol_universe:
  primary:
    - XAUUSD
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - NZDUSD
    - USDCAD
    - USDCHF

  secondary_cross_robustness:
    - EURJPY
    - GBPJPY
    - EURGBP
    - AUDJPY

data_source: exness_prepared_bid_ohlc
price_type: bid
timezone: UTC

daily_bar_boundary:
  convention: prepared_daily_bar_label
  authority: prepared_ohlc_timestamp
  calendar_month_timezone: UTC
  ny17_conversion_required: false

previous_freeze_version: 1
change_reason: >-
  Engineering/data-pipeline simplification before predictive or performance
  results are viewed: prepared Exness Bid OHLC is now the research input
  authority. Track B no longer revalidates raw ticks or reconstructs Daily
  OHLC from 1m data; M1A v2 consumes prepared 1d OHLC directly.
changed_fields:
  - data_source
  - daily_bar_boundary
  - structural_validation_input
status: frozen

notes: >-
  Source is prepared Exness Bid OHLC. Prepared OHLC frequencies from 1m
  through 1w may exist; M1A authority is prepared 1d. The prepared Daily
  bar label is a UTC calendar timestamp and is not converted to a nominal
  New York 17:00 close. Small differences around the NY17 boundary are an
  accepted non-material implementation convention for the v2 Practical
  Track.
  The warmup period is used only for predictor formation and state
  initialization and is excluded from Development, Validation, and Final
  Holdout evaluation samples. The primary and secondary universes are
  pre-specified and are not exchanged based on performance results. Final
  Holdout predictive and performance results are not viewed until M7.
