  calendar_month_timezone: UTC
  ny17_conversion_required: false

previous_freeze_version: 2
change_reason: >-
  2015-01 through 2015-08 prepared historical OHLC is unavailable; the
  earliest consistently available prepared data begins in 2015-09. This
  change is made before viewing Track B predictive or performance results.
changed_fields:
  - warmup_data_start
  - requested_range
  - data_availability
status: frozen

notes: >-
  Source is prepared Exness Bid OHLC. Prepared OHLC frequencies from 1m
  through 1w may exist; M1A authority is prepared 1d. The prepared Daily
  bar label is a UTC calendar timestamp and is not converted to a nominal
  New York 17:00 close. Small differences around the NY17 boundary are an
  accepted non-material implementation convention for the v2 Practical
  Track. Historical prepared OHLC is available from 2015-09 onward. The
  2015-09 through 2016-12 period is warmup history; the first Development
  outcome remains 2017-01 and requires the 2015-12 past-12m price.
  The warmup period is used only for predictor formation and state
  initialization and is excluded from Development, Validation, and Final
  Holdout evaluation samples. The primary and secondary universes are
  pre-specified and are not exchanged based on performance results. Final
  Holdout predictive and performance results are not viewed until M7.
