notes: >-
  Source is Exness MT5 tick data. OHLC is constructed from Bid ticks.
  Raw tick timestamps are UTC. Daily boundary uses the IANA timezone
  America/New_York at local time 17:00; expected UTC offsets are sanity
  metadata only and are not the DST authority.
  The warmup period is used only for predictor formation and state
  initialization and is excluded from Development, Validation, and Final
  Holdout evaluation samples. The primary and secondary universes are
  pre-specified and are not exchanged based on performance results. Final
  Holdout predictive and performance results are not viewed until M7.
